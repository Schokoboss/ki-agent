<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Nova-Link</title>
<link rel="icon" href="icons/icon-192.png">
<style>
  :root { --bg: #f4f4f7; --card: #fff; --text: #17171c; --muted: #6b6b76; --accent: #6d5dfc; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111116; --card: #1c1c24; --text: #ececf1; --muted: #9a9aa6; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg);
         color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 380px; background: var(--card); border-radius: 20px; padding: 28px 24px; text-align: center;
         box-shadow: 0 8px 30px rgba(0, 0, 0, .08); }
  img { width: 64px; height: 64px; border-radius: 16px; }
  h1 { font-size: 20px; margin: 14px 0 6px; }
  p { color: var(--muted); margin: 0; }
  .spin { width: 22px; height: 22px; margin: 18px auto 0; border: 3px solid var(--muted); border-top-color: var(--accent);
          border-radius: 50%; animation: s 0.8s linear infinite; opacity: .6; }
  @keyframes s { to { transform: rotate(360deg); } }
  button { margin-top: 18px; border: 0; border-radius: 12px; padding: 11px 18px; font: inherit; font-weight: 600;
           background: var(--accent); color: #fff; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="icons/icon-192.png" alt="">
  <h1 id="title">Öffne …</h1>
  <p id="desc">Suche den Nova-Laptop.</p>
  <div class="spin" id="spin"></div>
  <button id="again" type="button" hidden>Nochmal versuchen</button>
</main>
<script>
// Fester Link auf eine von Nova veröffentlichte Seite: go.html#<owner>/<gist>/<seite>/<datei>
// Die Tunnel-Adresse des Laptops ändert sich bei jedem Neustart – hier wird die aktuelle aus dem Gist geholt.
const $ = id => document.getElementById(id);
const [owner, gist, ...rest] = location.hash.slice(1).split('/');
const page = rest.join('/');

function show(title, desc, retry) {
  $('title').textContent = title;
  $('desc').textContent = desc;
  $('spin').hidden = !!retry;
  $('again').hidden = !retry;
}

async function go() {
  show('Öffne …', 'Suche den Nova-Laptop.');
  if (!/^[A-Za-z0-9-]{1,39}$/.test(owner || '') || !/^[a-f0-9]{20,40}$/.test(gist || '') || !/^[A-Za-z0-9]{8,20}\//.test(page)) {
    show('Link kaputt', 'Dieser Link ist unvollständig – lass ihn dir von Nova nochmal geben.');
    return;
  }
  let url = '';
  try {
    const r = await fetch(`https://gist.githubusercontent.com/${owner}/${gist}/raw/agent-endpoint.json?t=${Date.now()}`,
      { cache: 'no-store', signal: AbortSignal.timeout(9000) });
    url = r.ok ? (await r.json()).url || '' : '';
  } catch { /* unten */ }
  if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(url)) {
    show('Laptop ist aus', 'Die Seite liegt auf dem Nova-Laptop. Sobald er läuft, geht der Link wieder.', true);
    return;
  }
  try {
    const r = await fetch(url + '/api/ping', { cache: 'no-store', signal: AbortSignal.timeout(9000) });
    if (!r.ok) throw new Error();
  } catch {
    show('Laptop gerade nicht erreichbar', 'Vielleicht schläft er oder startet gerade neu – gleich nochmal versuchen.', true);
    return;
  }
  location.replace(`${url}/p/${page}`);
}

$('again').onclick = go;
go();
</script>
</body>
</html>
