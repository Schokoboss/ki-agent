<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova Drive – Modell-Vorschau</title>
<style>body{margin:0;background:#15131f;color:#eee;font:14px system-ui}canvas{display:block}#i{position:fixed;left:10px;top:8px}</style>
<script type="importmap">{ "imports": { "three": "../lib/three.module.min.js" } }</script>
</head><body><div id="i"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '../lib/loaders/GLTFLoader.js';
import { MeshoptDecoder } from '../lib/libs/meshopt_decoder.module.js';
const Q = new URLSearchParams(location.search);
const WELT = Q.get('welt'); const SRC = Q.get('src') || '../models';
const ids = WELT ? WELT.split(',') : (Q.get('cars') || 'kestrel,tundra,velora,ostwind,brenner,aurum,volt,phantom').split(',');
const R = new THREE.WebGLRenderer({ antialias: true }); R.setSize(innerWidth, innerHeight); R.toneMapping = THREE.ACESFilmicToneMapping; R.outputColorSpace = THREE.SRGBColorSpace;
R.shadowMap.enabled = true; document.body.appendChild(R.domElement);
const S = new THREE.Scene(); S.background = new THREE.Color('#9fb8d8');
const pm = new THREE.PMREMGenerator(R); const es = new THREE.Scene();
const g = new THREE.SphereGeometry(10, 32, 16); const col = []; const pos = g.attributes.position;
for (let k = 0; k < pos.count; k++) { const y = pos.getY(k) / 10; const c = y > 0 ? new THREE.Color('#ffe2c0').lerp(new THREE.Color('#5d8fe0'), Math.pow(y, .6)) : new THREE.Color('#ffe2c0').lerp(new THREE.Color('#2d3a26'), Math.min(1, -y * 3)); col.push(c.r, c.g, c.b); }
g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); es.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
S.environment = pm.fromScene(es, 0.02).texture;
S.add(new THREE.HemisphereLight(0xffffff, 0x445533, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 2.5); sun.position.set(6, 10, 8); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -16, right: 16, top: 10, bottom: -10 }); S.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 40), new THREE.MeshStandardMaterial({ color: '#555960', roughness: .9 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; S.add(ground);
const cam = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, .1, 200);
const colors = ['#e8432e', '#3d6b3a', '#d7263d', '#1f4e9c', '#ff6b00', '#c9a227', '#f1f1f1', '#6d5dfc'];
const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder); await MeshoptDecoder.ready; const cars = [];
const cols = Math.min(4, ids.length);
const cols2 = WELT ? Math.ceil(Math.sqrt(ids.length * 1.8)) : 0;
await Promise.all(ids.map((id, i) => loader.loadAsync(WELT ? `../models/welt/${id}.glb` : `${SRC}/${id}.glb`).then(gl => {
  if (WELT) {
    const m = gl.scene; const bb = new THREE.Box3().setFromObject(m); const sz = bb.getSize(new THREE.Vector3());
    const k = 4.2 / Math.max(sz.x, sz.y, sz.z); m.scale.setScalar(k);
    m.position.set((i % cols2 - (cols2 - 1) / 2) * 5.2, -bb.min.y * k, -Math.floor(i / cols2) * 5.2 + 6);
    m.rotation.y = 0.5; m.traverse(o => { if (o.isMesh) o.castShadow = true; }); S.add(m); cars.push(m);
    document.getElementById('i').innerHTML += id + ' ';
    return;
  }
  const m = gl.scene; m.traverse(o => { if (o.isMesh) { o.castShadow = true; if (o.material.name === 'paint') { o.material = o.material.clone(); o.material.color.set(colors[i % 8]); } } });
  m.position.set((i % cols - (cols - 1) / 2) * 5.6, 0, -Math.floor(i / cols) * 7 + 3); m.rotation.y = 0.6; S.add(m); cars.push(m);
  let t = 0; m.traverse(o => { if (o.isMesh) t += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; });
  document.getElementById('i').innerHTML += `${id}: ${Math.round(t)} Dreiecke<br>`;
})));
const v = new URLSearchParams(location.search).get('view') || 'front';
const rows = Math.ceil(ids.length / cols);
if (WELT) { const r2 = Math.ceil(ids.length / cols2); ground.scale.set(3, 3, 1); cam.fov = 40; cam.updateProjectionMatrix(); cam.position.set(0, 16 + r2 * 3, 22 + r2 * 2); cam.lookAt(0, 0, -(r2 - 1) * 2.6 + 4); Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40 }); sun.shadow.camera.updateProjectionMatrix(); }
else if (ids.length === 1) cam.position.set(5.5, 2.2, 6.5); else cam.position.set(0, 9 + rows * 2, 16 + rows * 2);
if (!WELT) cam.lookAt(0, 0.6, ids.length === 1 ? 0 : -(rows - 1) * 3.5 + 1);
if (v === 'back') cars.forEach(c => c.rotation.y = Math.PI + 0.6);
if (v === 'side') cars.forEach(c => c.rotation.y = Math.PI / 2);
if (v === 'close') { cam.position.set(4.2, 1.6, 5.2); cam.lookAt(0, 0.8, cars.length > 1 ? 3 : 0); }
R.render(S, cam); document.title = 'ok';
</script></body></html>
