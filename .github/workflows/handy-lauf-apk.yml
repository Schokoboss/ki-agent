# Baut die Handy-App „Nova Lauf“ (handy-lauf/) als APK und stellt sie als Download bereit:
# https://github.com/Schokoboss/ki-agent/releases/download/nova-lauf/NovaLauf.apk
name: Nova Lauf APK

on:
  push:
    branches: [main, ccr-13af9ef8-cf8sk6]
    paths: ['handy-lauf/**', '.github/workflows/handy-lauf-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: handy-lauf-apk
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - name: Quelle holen
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # Immer derselbe Schlüssel → Updates lassen sich über die alte Version installieren.
      - name: Signier-Schlüssel wiederverwenden
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nova-lauf-debug-keystore-v1

      - name: APK bauen
        working-directory: handy-lauf
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: APK bereitlegen
        run: cp handy-lauf/app/build/outputs/apk/debug/app-debug.apk NovaLauf.apk

      - name: Als Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: NovaLauf-apk
          path: NovaLauf.apk

      - name: Als Download veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nova-lauf --yes --cleanup-tag || true
          gh release create nova-lauf NovaLauf.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Nova Lauf (Handy-App, Bau ${GITHUB_RUN_NUMBER})" \
            --notes "Hält in Roblox den Joystick nach vorne – wie W gedrückt halten. Installieren: NovaLauf.apk am Handy antippen. Anleitung: handy-lauf/README.md"
