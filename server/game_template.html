<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b1a">
<title>Nova-Spiel</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0b1a; color: #fff; touch-action: none;
    user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: system-ui, "Segoe UI", Roboto, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; right: 12px; z-index: 2; display: flex;
    gap: 14px; align-items: center; font-weight: 800; font-size: 18px; text-shadow: 0 2px 6px #000b; pointer-events: none; }
  #hud .grow { flex: 1; }
  #hud .dim { opacity: .7; font-weight: 600; font-size: 15px; }
  #hud button { pointer-events: auto; width: 40px; height: 40px; border: 0; border-radius: 12px; background: #ffffff24;
    color: #fff; font-size: 16px; cursor: pointer; }
  .screen { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: 24px; text-align: center; background: #0b0b1ae0; }
  .screen[hidden] { display: none; }
  .screen h1 { margin: 0; font-size: clamp(32px, 9vw, 58px); line-height: 1.05; background: linear-gradient(90deg, var(--a), var(--b));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .screen p { margin: 0; max-width: 440px; color: #cfcfe6; line-height: 1.45; }
  .screen .big { font-size: 30px; font-weight: 900; color: #fff; }
  .screen .small { font-size: 13px; opacity: .7; }
  .screen button { margin-top: 6px; border: 0; border-radius: 999px; padding: 15px 42px; font: inherit; font-size: 20px;
    font-weight: 900; color: #fff; background: linear-gradient(135deg, var(--a), var(--b)); box-shadow: 0 8px 28px #0009; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" hidden>
  <span id="hScore">0</span><span id="hLives"></span><span id="hLevel" class="dim"></span>
  <span class="grow"></span><span id="hBest" class="dim"></span>
  <button id="muteBtn" type="button" aria-label="Ton">🔊</button><button id="pauseBtn" type="button" aria-label="Pause">❚❚</button>
</div>
<div class="screen" id="menu">
  <h1 id="mTitle"></h1>
  <p id="mHow"></p>
  <p class="small" id="mControls"></p>
  <p id="mBest"></p>
  <button type="button" id="playBtn">Spielen</button>
</div>
<div class="screen" id="pause" hidden>
  <h1>Pause</h1>
  <button type="button" id="resumeBtn">Weiter</button>
</div>
<div class="screen" id="over" hidden>
  <h1>Game Over</h1>
  <p class="big" id="oScore"></p>
  <p id="oBest"></p>
  <button type="button" id="againBtn">Nochmal</button>
</div>
<script>
// ===================== EINSTELLUNGEN =====================
const CONFIG = {
  title: "Nova-Spiel",
  howTo: "Sammle Sterne, weiche Felsen aus und schieß sie ab.",
  lives: 3,
  stick: true,            // Handy: Joystick links + Feuerknopf rechts. false = Tippen/Wischen aufs Spielfeld
  colors: ["#00e5ff", "#a259ff"],
  background: "#0b0b1a",
};

// ===================== MOTOR (nicht ändern) =====================
const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);
let W = 0, H = 0, U = 1, DPR = 1;            // Spielfeld in CSS-Pixeln, U = 1 % der kürzeren Seite
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const hit = (a, b) => dist(a, b) < (a.r || 0) + (b.r || 0);                       // Kreise {x, y, r}
const hitRect = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; // {x, y, w, h}
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
// Zeichnen leicht gemacht
const EMOJI_FONT = '"Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
function emoji(ch, x, y, size, angle = 0) {
  ctx.save(); ctx.translate(x, y); if (angle) ctx.rotate(angle);
  ctx.font = `${Math.round(size)}px ${EMOJI_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(ch, 0, size * 0.06); ctx.restore();
}
function circle(x, y, r, color) { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); ctx.fill(); }
function rect(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(x, y, w, h); }
function text(str, x, y, size = 5 * U, color = '#fff', align = 'center') {
  ctx.font = `800 ${Math.round(size)}px system-ui, sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = color; ctx.fillText(String(str), x, y);
}
function glow(color, blur = 2.5 * U) { ctx.shadowColor = color || 'transparent'; ctx.shadowBlur = color ? blur : 0; }
function bar(x, y, w, h, part, color = '#4ade80') { rect(x, y, w, h, '#ffffff22'); rect(x, y, w * clamp(part, 0, 1), h, color); }

const state = { mode: 'menu', score: 0, lives: CONFIG.lives, time: 0, level: 1,
  best: +(localStorage.getItem('best:' + CONFIG.title) || 0) };
window.novaState = state;

const input = { ax: 0, ay: 0, left: false, right: false, up: false, down: false, fire: false, firePressed: false,
  x: 0, y: 0, pointer: false, tap: false };
const keys = {};
const pointers = new Map();
let isTouch = matchMedia('(pointer: coarse)').matches;
let ready = false;  // erst true, wenn `game` unten definiert ist
const keyDown = (...codes) => codes.some(c => keys[c]);

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight; U = Math.min(W, H) / 100;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  if (ready && game.resize) game.resize();
}
resize();

addEventListener('keydown', e => {
  unlockAudio();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  keys[e.code] = true;
  if (e.code === 'KeyP' || e.code === 'Escape') togglePause();
  if ((e.code === 'Space' || e.code === 'Enter') && (state.mode === 'menu' || (state.mode === 'over' && Date.now() - overAt > 700))) startGame();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

canvas.addEventListener('pointerdown', e => {
  unlockAudio();
  if (e.pointerType === 'touch') isTouch = true;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* egal */ }
  const p = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, role: 'tap', mouse: e.pointerType === 'mouse' };
  if (CONFIG.stick && e.pointerType !== 'mouse') p.role = p.x < W / 2 ? 'stick' : 'fire';
  pointers.set(e.pointerId, p);
  if (p.role === 'tap') { input.tap = true; input.x = p.x; input.y = p.y; }
});
canvas.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  if (p) { p.x = e.clientX; p.y = e.clientY; }
  if (!p || p.role === 'tap') { input.x = e.clientX; input.y = e.clientY; }
});
const pointerEnd = e => pointers.delete(e.pointerId);
canvas.addEventListener('pointerup', pointerEnd);
canvas.addEventListener('pointercancel', pointerEnd);

function readInput() {
  let ax = (keyDown('ArrowRight', 'KeyD') ? 1 : 0) - (keyDown('ArrowLeft', 'KeyA') ? 1 : 0);
  let ay = (keyDown('ArrowDown', 'KeyS') ? 1 : 0) - (keyDown('ArrowUp', 'KeyW') ? 1 : 0);
  let fire = keyDown('Space', 'Enter', 'KeyJ'), held = false;
  for (const p of pointers.values()) {
    if (p.role === 'stick') {
      const dx = p.x - p.sx, dy = p.y - p.sy, l = Math.hypot(dx, dy), m = Math.min(1, l / (12 * U));
      if (l > 4) { ax = dx / l * m; ay = dy / l * m; }
    } else if (p.role === 'fire') fire = true;
    else { held = true; if (p.mouse) fire = true; }
  }
  if (ax && ay && Math.abs(ax) + Math.abs(ay) > 1.2) { ax *= 0.7071; ay *= 0.7071; }
  input.ax = clamp(ax, -1, 1); input.ay = clamp(ay, -1, 1);
  input.left = input.ax < -0.3; input.right = input.ax > 0.3; input.up = input.ay < -0.3; input.down = input.ay > 0.3;
  input.firePressed = fire && !input.fire; input.fire = fire; input.pointer = held;
}

// --- Ton (selbst erzeugt, keine Dateien nötig)
let AC = null, muted = localStorage.getItem('muted') === '1';
const lastSound = {};
const SOUNDS = { shoot: [880, 0.08, 'square', -500], hit: [200, 0.16, 'sawtooth', -140], coin: [880, 0.12, 'triangle', 660],
  jump: [380, 0.16, 'square', 420], hurt: [150, 0.32, 'sawtooth', -100], power: [520, 0.4, 'triangle', 880],
  over: [320, 0.8, 'triangle', -260], click: [660, 0.05, 'square', 0], level: [600, 0.45, 'square', 600] };
function unlockAudio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
  if (AC.state === 'suspended') AC.resume();
}
function sound(name) {
  if (!AC || muted) return;
  const now = AC.currentTime;
  if (lastSound[name] && now - lastSound[name] < 0.04) return;
  lastSound[name] = now;
  const [f, d, type, slide] = SOUNDS[name] || SOUNDS.click;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, now); o.frequency.linearRampToValueAtTime(Math.max(40, f + slide), now + d);
  g.gain.setValueAtTime(0.1, now); g.gain.exponentialRampToValueAtTime(0.001, now + d);
  o.connect(g); g.connect(AC.destination); o.start(now); o.stop(now + d + 0.02);
}

// --- Effekte
const fx = { parts: [], texts: [], shake: 0 };
function particles(x, y, color = '#fff', n = 14, speed = 1) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), v = rand(8, 40) * U * speed;
    fx.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.35, 0.8), max: 0.8, color, size: rand(0.4, 1.2) * U });
  }
}
function floatText(x, y, text, color = '#fff') { fx.texts.push({ x, y, text: String(text), color, life: 1 }); }
function shake(power = 1) { fx.shake = Math.min(fx.shake + power * U * 1.2, U * 4); }
function updateFx(dt) {
  for (const p of fx.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94; p.life -= dt; }
  fx.parts = fx.parts.filter(p => p.life > 0);
  for (const t of fx.texts) { t.y -= 12 * U * dt; t.life -= dt; }
  fx.texts = fx.texts.filter(t => t.life > 0);
  fx.shake = Math.max(0, fx.shake - 30 * U * dt);
}
function drawFx() {
  for (const p of fx.parts) { ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
  ctx.globalAlpha = 1; ctx.textAlign = 'center'; ctx.font = `800 ${Math.round(4.5 * U)}px system-ui, sans-serif`;
  for (const t of fx.texts) { ctx.globalAlpha = clamp(t.life, 0, 1); ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y); }
  ctx.globalAlpha = 1;
}

// --- Punkte, Leben, Level
function addScore(n = 1) { state.score += n; hud(); }
function loseLife(n = 1) {
  if (state.mode !== 'play') return;
  state.lives -= n; shake(2.5); sound('hurt'); hud();
  if (state.lives <= 0) gameOver();
}
let overAt = 0;
function gameOver() {
  if (state.mode !== 'play') return;
  state.mode = 'over'; overAt = Date.now(); sound('over');
  const record = state.score > state.best;
  if (record) { state.best = state.score; localStorage.setItem('best:' + CONFIG.title, String(state.best)); }
  $('oScore').textContent = `${state.score} Punkte`;
  $('oBest').textContent = record && state.score > 0 ? '🏆 Neuer Rekord!' : `Rekord: ${state.best}`;
  $('over').hidden = false; $('hud').hidden = true;
}
function startGame() {
  unlockAudio();
  Object.assign(state, { mode: 'play', score: 0, lives: CONFIG.lives, time: 0, level: 1 });
  fx.parts = []; fx.texts = []; fx.shake = 0;
  game.init();
  $('menu').hidden = true; $('over').hidden = true; $('pause').hidden = true; $('hud').hidden = false;
  hud(); sound('click');
}
function togglePause() {
  if (state.mode === 'play') { state.mode = 'pause'; $('pause').hidden = false; }
  else if (state.mode === 'pause') { state.mode = 'play'; $('pause').hidden = true; last = performance.now(); }
}
function hud() {
  $('hScore').textContent = `⭐ ${state.score}`;
  $('hLives').textContent = state.lives > 0 && state.lives <= 8 ? '❤️'.repeat(state.lives) : `❤️ ${Math.max(0, state.lives)}`;
  $('hLevel').textContent = `Level ${state.level}`;
  $('hBest').textContent = state.best ? `🏆 ${state.best}` : '';
}

// --- Handy-Steuerung zeichnen
function drawControls() {
  if (!isTouch || !CONFIG.stick || state.mode !== 'play') return;
  const R = 12 * U;
  let stick = null;
  for (const p of pointers.values()) if (p.role === 'stick') stick = p;
  const bx = stick ? stick.sx : W * 0.2, by = stick ? stick.sy : H - R * 2.2;
  ctx.globalAlpha = stick ? 0.35 : 0.18; ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(bx, by, R, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 0.55;
  ctx.beginPath(); ctx.arc(bx + input.ax * R, by + input.ay * R, R * 0.45, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = input.fire ? 0.55 : 0.25; ctx.fillStyle = CONFIG.colors[0];
  ctx.beginPath(); ctx.arc(W * 0.8, H - R * 2.2, R * 0.8, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
}

function crash(e) {
  console.error('Fehler im Spiel: ' + (e && e.stack || e));
  state.mode = 'over'; $('hud').hidden = true;
  $('over').hidden = false; $('oScore').textContent = 'Ups – Fehler im Spiel'; $('oBest').textContent = String(e && e.message || e);
}

// ==== SPIEL START (nur dieser Teil ist das eigentliche Spiel) ====
const game = {
  init() {
    this.ship = { x: W / 2, y: H * 0.8, r: 4 * U, cool: 0 };
    this.items = []; this.shots = []; this.spawn = 0;
  },
  update(dt) {
    const s = this.ship;
    s.x = clamp(s.x + input.ax * 70 * U * dt, s.r, W - s.r);
    s.y = clamp(s.y + input.ay * 70 * U * dt, H * 0.3, H - s.r);
    if (input.pointer) { s.x += (input.x - s.x) * Math.min(1, 10 * dt); s.y += (input.y - s.y) * Math.min(1, 10 * dt); }
    s.cool -= dt;
    if (input.fire && s.cool <= 0) { this.shots.push({ x: s.x, y: s.y - s.r, r: U }); s.cool = 0.22; sound('shoot'); }
    for (const b of this.shots) b.y -= 120 * U * dt;
    this.spawn -= dt;
    if (this.spawn <= 0) {
      const rock = Math.random() < 0.55;
      this.items.push({ x: rand(5 * U, W - 5 * U), y: -5 * U, r: rock ? rand(3, 6) * U : 2.5 * U, rock,
        vy: rand(20, 32) * U * (1 + state.level * 0.15) });
      this.spawn = Math.max(0.25, 0.9 - state.level * 0.08);
    }
    for (const it of this.items) {
      it.y += it.vy * dt;
      if (hit(it, s)) {
        it.dead = true;
        if (it.rock) { particles(it.x, it.y, '#ff6b6b', 20); loseLife(); }
        else { addScore(5); sound('coin'); floatText(it.x, it.y, '+5', '#ffd166'); }
      }
      for (const b of this.shots) if (it.rock && !b.dead && hit(it, b)) {
        it.dead = b.dead = true; addScore(2); sound('hit'); particles(it.x, it.y, '#c8a27a', 16); shake(0.6);
      }
      if (it.y > H + it.r) it.dead = true;
    }
    this.items = this.items.filter(i => !i.dead);
    this.shots = this.shots.filter(b => !b.dead && b.y > -b.r);
  },
  draw(ctx) {
    glow('#7df9ff');
    for (const b of this.shots) rect(b.x - b.r / 2, b.y - b.r * 2, b.r, b.r * 4, '#7df9ff');
    glow(null);
    for (const it of this.items) emoji(it.rock ? '🪨' : '⭐', it.x, it.y, it.r * 2.2, it.rock ? it.y / (20 * U) : 0);
    emoji('🚀', this.ship.x, this.ship.y, this.ship.r * 2.6, -Math.PI / 4);
  },
};
// ==== SPIEL ENDE ====

// ===================== START (nicht ändern) =====================
const stars = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), s: rand(0.15, 0.5), v: rand(0.01, 0.05) }));
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  readInput();
  try {
    if (state.mode === 'play') {
      state.time += dt;
      const lvl = 1 + Math.floor(state.time / 25);
      if (lvl > state.level) { state.level = lvl; hud(); sound('level'); floatText(W / 2, H * 0.4, `Level ${lvl}!`, CONFIG.colors[0]); }
      game.update(dt);
    }
    updateFx(dt);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = CONFIG.background; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffffff';
    if (CONFIG.stars !== false) for (const st of stars) {
      if (state.mode === 'play') st.y = (st.y + st.v * dt) % 1;
      ctx.globalAlpha = 0.25 + st.s; ctx.fillRect(st.x * W, st.y * H, st.s * U * 0.6, st.s * U * 0.6);
    }
    ctx.globalAlpha = 1;
    if (fx.shake) ctx.translate(rand(-fx.shake, fx.shake), rand(-fx.shake, fx.shake));
    game.draw(ctx);
    drawFx();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    drawControls();
  } catch (e) { crash(e); }
  input.tap = false;
  requestAnimationFrame(frame);
}

document.documentElement.style.setProperty('--a', CONFIG.colors[0]);
document.documentElement.style.setProperty('--b', CONFIG.colors[1] || CONFIG.colors[0]);
document.title = CONFIG.title;
$('mTitle').textContent = CONFIG.title;
$('mHow').textContent = CONFIG.howTo;
$('mControls').textContent = CONFIG.stick
  ? 'Handy: Joystick links, Feuer rechts · PC: Pfeiltasten/WASD + Leertaste'
  : 'Handy: aufs Spielfeld tippen/ziehen · PC: Maus, Pfeiltasten/WASD + Leertaste';
$('mBest').textContent = state.best ? `🏆 Rekord: ${state.best}` : '';
$('playBtn').onclick = startGame; $('againBtn').onclick = startGame; $('resumeBtn').onclick = togglePause;
$('pauseBtn').onclick = togglePause;
$('muteBtn').textContent = muted ? '🔇' : '🔊';
$('muteBtn').onclick = () => { muted = !muted; localStorage.setItem('muted', muted ? '1' : '0'); $('muteBtn').textContent = muted ? '🔇' : '🔊'; };
document.addEventListener('visibilitychange', () => { if (document.hidden && state.mode === 'play') togglePause(); });
addEventListener('resize', resize);
ready = true;
try { game.init(); } catch (e) { crash(e); }
hud();
requestAnimationFrame(frame);
</script>
</body>
</html>
