<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <title>Solstice Drive</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d14; overflow: hidden; overscroll-behavior: none; }
    body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    #buehne { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #ui { position: fixed; inset: 0; pointer-events: none; }
    #laden { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(120% 90% at 50% 100%, #ff7a18 0%, #b3245c 34%, #2a1250 62%, #0b0d14 100%); color: #fff; font: 600 15px system-ui, sans-serif; z-index: 50; transition: opacity .5s; }
    #laden h1 { margin: 0; font: 900 clamp(34px, 9vw, 72px)/1 system-ui, sans-serif; letter-spacing: .06em; font-style: italic; text-shadow: 0 4px 30px rgba(0,0,0,.45); }
    #laden .balken { width: min(60vw, 420px); height: 6px; border-radius: 3px; background: rgba(255,255,255,.22); overflow: hidden; }
    #laden .balken i { display: block; height: 100%; width: 0%; background: #fff; transition: width .2s; }
    #laden small { opacity: .85; font-weight: 500; }
  </style>
</head>
<body>
  <canvas id="buehne"></canvas>
  <div id="ui"></div>
  <div id="laden"><h1>SOLSTICE DRIVE</h1><div class="balken"><i id="ladebalken"></i></div><small id="ladetext">Kap Aurora erwacht …</small></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
